<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amplify Link Finder — Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a; color: #e0e0e0;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #2a2a2a; border-radius: 12px; padding: 30px;
      max-width: 400px; width: 100%; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo { font-size: 24px; font-weight: 800; color: #F37321; letter-spacing: 1px; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #888; margin-bottom: 24px; }
    .step { background: #323232; border-radius: 8px; padding: 16px; margin-bottom: 12px; text-align: left; }
    .step-title { font-size: 12px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .step-num { display: inline-block; background: #F37321; color: #fff; border-radius: 50%; width: 20px; height: 20px; text-align: center; line-height: 20px; font-size: 11px; font-weight: 700; margin-right: 6px; }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #333; border: none; border-radius: 6px;
      padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
      width: 100%; margin-top: 10px; text-decoration: none; transition: background 0.2s;
    }
    .btn-google:hover { background: #f0f0f0; }
    .btn-google img { width: 18px; height: 18px; }
    .success-box {
      display: none; background: #1a2a1a; border: 2px solid #4caf50;
      border-radius: 8px; padding: 20px; margin-top: 12px; text-align: center;
    }
    .success-icon { font-size: 36px; margin-bottom: 10px; }
    .success-title { font-size: 14px; font-weight: 700; color: #4caf50; margin-bottom: 6px; }
    .success-email { font-size: 12px; color: #aaa; margin-bottom: 10px; }
    .success-desc { font-size: 11px; color: #888; line-height: 1.6; }
    .error-box {
      display: none; background: #2a1a1a; border: 1px solid #f44336;
      border-radius: 8px; padding: 16px; margin-top: 12px;
      font-size: 12px; color: #f44336; line-height: 1.6;
    }
    .loading { color: #888; font-size: 12px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">AMPLIFY</div>
  <div class="subtitle">Link Finder — Google Drive Sign In</div>

  <div id="main-content">
    <div class="step">
      <div class="step-title"><span class="step-num">1</span>Sign in with Google</div>
      <a id="btn-signin" href="#" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>
        Sign in with Google
      </a>
    </div>
  </div>

  <div id="loading" class="loading">Signing you in...</div>

  <div id="success-box" class="success-box">
    <div class="success-icon">✅</div>
    <div class="success-title">Signed In Successfully!</div>
    <div class="success-email" id="success-email"></div>
    <div class="success-desc">You can now close this and return to InDesign.<br>The plugin will be ready to use.</div>
  </div>

  <div id="error-box" class="error-box"></div>
</div>

<script>
  const CLIENT_ID    = '78836034969-oukoojj5ef462ig9h3hsa1sqfm9167g3.apps.googleusercontent.com';
  const REDIRECT_URI = 'https://beanmatt.github.io/amplify-link-finder/';
  const SCOPE        = 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/userinfo.email';

  function showError(msg) {
    document.getElementById('loading').style.display       = 'none';
    document.getElementById('main-content').style.display  = 'none';
    var box = document.getElementById('error-box');
    box.textContent   = msg;
    box.style.display = 'block';
  }

  function getHashParam(name) {
    return new URLSearchParams(window.location.hash.substring(1)).get(name);
  }

  function getUrlParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  // Sign in button
  document.getElementById('btn-signin').addEventListener('click', function(e) {
    e.preventDefault();
    var params = new URLSearchParams({
      client_id:     CLIENT_ID,
      redirect_uri:  REDIRECT_URI,
      response_type: 'token',
      scope:         SCOPE,
      include_granted_scopes: 'true'
    });
    window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
  });

  // Handle token returned in URL hash
  var accessToken = getHashParam('access_token');
  var expiresIn   = getHashParam('expires_in');
  var error       = getUrlParam('error');

  if (error) {
    showError('Sign in was cancelled or failed: ' + error);
  } else if (accessToken) {
    document.getElementById('main-content').style.display = 'none';
    document.getElementById('loading').style.display      = 'block';

    fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
      headers: { Authorization: 'Bearer ' + accessToken }
    })
    .then(function(r) { return r.json(); })
    .then(function(user) {
      var tokenObj = {
        access_token:  accessToken,
        refresh_token: '',
        expiry:        Date.now() + ((parseInt(expiresIn) || 3600) * 1000),
        email:         user.email || ''
      };

      // Send token to parent (plugin webview)
      try {
        window.parent.postMessage(JSON.stringify({
          type:  'amplify_token',
          token: tokenObj
        }), '*');
      } catch(e) {}

      // Also try webkit message handler for UXP webview
      try {
        window.webkit.messageHandlers.amplifyToken.postMessage(JSON.stringify({
          type:  'amplify_token',
          token: tokenObj
        }));
      } catch(e) {}

      // Show success
      document.getElementById('loading').style.display         = 'none';
      document.getElementById('success-email').textContent     = '✓ ' + user.email;
      document.getElementById('success-box').style.display     = 'block';

      window.history.replaceState({}, document.title, REDIRECT_URI);
    })
    .catch(function(e) {
      showError('Could not get account info: ' + e.message);
    });
  }
</script>
</body>
</html>
